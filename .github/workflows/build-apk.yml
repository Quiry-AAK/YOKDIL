name: Build APK

on:
  push:
    branches: [main, claude/ai-json-conversion-prompt-zugrxv]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Web build
        run: npm ci && npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Android SDK yolu ayarla
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Keystore'u secrets'tan oluştur
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/yokdil.keystore

      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: yokdil.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yokdil-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
