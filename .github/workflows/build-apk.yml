name: Build APK

on:
  push:
    branches: [main, claude/ai-json-conversion-prompt-zugrxv]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Web build
        run: npm ci && npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Android SDK yolu ayarla
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Keystore önbellekten yükle
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Keystore oluştur (sadece ilk çalıştırmada)
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yokdil-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
